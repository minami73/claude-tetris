<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="header-row">
      <h1 class="game-title">TETRIS</h1>
      <button id="theme-toggle" class="theme-toggle" aria-label="Cambiar tema claro/oscuro" title="Cambiar tema claro/oscuro">🌙</button>
    </div>
    <div class="game-container">
      <div class="board-wrapper">
        <canvas id="board" width="300" height="600"></canvas>

        <div id="overlay" class="overlay hidden">
          <div class="overlay-box">
            <p id="overlay-title">GAME OVER</p>
            <p id="overlay-score"></p>
            <div id="highscore-entry" class="highscore-entry hidden">
              <p class="highscore-entry-label">¡Nuevo récord! Escribe tu nombre:</p>
              <input id="highscore-name" class="highscore-name-input" maxlength="12" placeholder="Nombre" autocomplete="off" />
              <button id="highscore-save-btn">Guardar</button>
            </div>
            <button id="restart-btn">Reiniciar</button>
          </div>
        </div>
      </div>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section highscores-section">
          <span class="label">RECORDS</span>
          <ol id="highscores-list" class="highscores-list"></ol>
          <div class="highscores-stats">
            <span>Mejor combo: <b id="best-combo">0</b></span>
            <span>Líneas máx: <b id="max-lines">0</b></span>
          </div>
          <button id="reset-highscores-btn" class="reset-highscores-btn">Resetear récords</button>
        </div>

        <div class="panel-section">
          <span class="label">TEMA VISUAL</span>
          <select id="skin-select" class="skin-select" aria-label="Elegir tema visual">
            <option value="retro">Retro</option>
            <option value="neon">Neón</option>
            <option value="pastel">Pastel</option>
            <option value="pixel">Pixel art</option>
          </select>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
